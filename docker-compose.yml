services:
  textoverimage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text-over-image-api
    restart: unless-stopped

    environment:
      # Server Configuration
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000

      # Security
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      API_TOKEN: ${API_TOKEN}

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

      # Watermark
      WATERMARK_ADDRESS: ${WATERMARK_ADDRESS:-Jakarta, Indonesia}

    # Port mapping
    # Change 3001 to any available port on host if needed
    ports:
      - "3001:3000"

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

    # Resource limits (optional, adjust based on needs)
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - prod_net
networks:
  prod_net:
    external: true
